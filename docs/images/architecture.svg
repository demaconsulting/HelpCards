<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Segoe UI, Arial, sans-serif">
  <!-- Architecture of HelpCards: the consumers on top, the six subsystems of the library in the dashed frame, and the
       Base Class Library below. Arrows show who uses whom; the SysML2 model under docs/sysml2 is authoritative. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="14" y="16" width="975" height="515" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="975" height="515" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
    <!-- Consumers -->
    <g text-anchor="middle" fill="#92400e">
      <rect x="0" y="0" width="215" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="107" y="26" font-size="15" font-weight="600">A library</text>
      <text x="107" y="48" font-size="12">exposes its cards as a HelpSource</text>
      <rect x="241" y="0" width="215" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="348" y="26" font-size="15" font-weight="600">A command-line tool</text>
      <text x="348" y="48" font-size="12">puts HelpCli before its parser</text>
      <rect x="482" y="0" width="215" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="589" y="26" font-size="15" font-weight="600">An agent host</text>
      <text x="589" y="48" font-size="12">offers the HelpAgentTool</text>
      <rect x="723" y="0" width="215" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="830" y="26" font-size="15" font-weight="600">A test project</text>
      <text x="830" y="48" font-size="12">asserts its cards are valid</text>
    </g>
    <g stroke="#475569" stroke-width="2">
      <line x1="190" y1="68" x2="190" y2="100" marker-end="url(#a)"/>
      <line x1="348" y1="68" x2="348" y2="100" marker-end="url(#a)"/>
      <line x1="589" y1="68" x2="589" y2="100" marker-end="url(#a)"/>
      <line x1="830" y1="68" x2="830" y2="100" marker-end="url(#a)"/>
    </g>
    <text x="468" y="90" font-size="12" fill="#334155" text-anchor="middle">use the public types</text>

    <!-- The library -->
    <rect x="150" y="104" width="790" height="276" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="166" y="126" font-size="14" font-weight="600" fill="#2563eb">DemaConsulting.HelpCards</text>

    <!-- Row one: from files to the immutable catalog -->
    <g text-anchor="middle" fill="#5b21b6" font-size="11">
      <rect x="170" y="140" width="230" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="285" y="166" font-size="15" font-weight="600" fill="#4c1d95">Loading</text>
      <text x="285" y="186">reads files, front matter, tokens,</text>
      <text x="285" y="200">cultures, and body links</text>
      <text x="285" y="222" font-style="italic" fill="#4c1d95">HelpSource</text>

      <rect x="420" y="140" width="230" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="535" y="166" font-size="15" font-weight="600" fill="#4c1d95">Composition</text>
      <text x="535" y="186">one pipeline: mounts, imports,</text>
      <text x="535" y="200">overlays, order, references</text>
      <text x="535" y="222" font-style="italic" fill="#4c1d95">HelpCatalogBuilder</text>

      <rect x="670" y="140" width="230" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <text x="785" y="166" font-size="15" font-weight="600" fill="#4c1d95">Catalog</text>
      <text x="785" y="186">immutable model, views, lookup,</text>
      <text x="785" y="200">search, and suggestions</text>
      <text x="785" y="222" font-style="italic" fill="#4c1d95">HelpCatalog, HelpCard</text>
    </g>
    <g stroke="#475569" stroke-width="2">
      <line x1="402" y1="188" x2="418" y2="188" marker-end="url(#a)"/>
      <line x1="652" y1="188" x2="668" y2="188" marker-end="url(#a)"/>
    </g>

    <!-- Row two: what is built on the catalog -->
    <g text-anchor="middle" fill="#1e40af" font-size="11">
      <rect x="170" y="264" width="230" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="285" y="290" font-size="15" font-weight="600" fill="#1e3a8a">Testing</text>
      <text x="285" y="310">validator, example, and Markdown</text>
      <text x="285" y="324">helpers for the adopter's tests</text>
      <text x="285" y="346" font-style="italic" fill="#1e3a8a">HelpCardValidator</text>

      <rect x="420" y="264" width="230" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="535" y="290" font-size="15" font-weight="600" fill="#1e3a8a">Integration</text>
      <text x="535" y="310">command-line helper and agent</text>
      <text x="535" y="324">knowledge tool</text>
      <text x="535" y="346" font-style="italic" fill="#1e3a8a">HelpCli, HelpAgentTool</text>

      <rect x="670" y="264" width="230" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="785" y="290" font-size="15" font-weight="600" fill="#1e3a8a">Presentation</text>
      <text x="785" y="310">text, Markdown, and JSON with</text>
      <text x="785" y="324">link styles and wrapping</text>
      <text x="785" y="346" font-style="italic" fill="#1e3a8a">HelpRenderOptions</text>
    </g>
    <g stroke="#475569" stroke-width="2">
      <line x1="785" y1="240" x2="785" y2="260" marker-end="url(#a)"/>
      <line x1="668" y1="312" x2="652" y2="312" marker-end="url(#a)"/>
      <line x1="285" y1="260" x2="285" y2="240" marker-end="url(#a)"/>
    </g>
    <g font-size="11" fill="#334155">
      <text x="795" y="254">renders</text>
      <text x="295" y="254">validates</text>
    </g>

    <!-- Inputs -->
    <text x="65" y="205" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Inputs</text>
    <rect x="0" y="219" width="130" height="66" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="65" y="246" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">Help cards</text>
    <text x="65" y="267" font-size="12" fill="#475569" text-anchor="middle">Markdown files</text>
    <line x1="134" y1="252" x2="146" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- The Base Class Library -->
    <line x1="545" y1="384" x2="545" y2="412" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="557" y="402" font-size="12" fill="#334155">built only on the Base Class Library</text>
    <g text-anchor="middle">
      <rect x="150" y="416" width="250" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="275" y="442" font-size="15" font-weight="600" fill="#334155">System.Reflection</text>
      <text x="275" y="462" font-size="12" fill="#475569">embedded resources</text>
      <rect x="420" y="416" width="250" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="545" y="442" font-size="15" font-weight="600" fill="#334155">System.IO</text>
      <text x="545" y="462" font-size="12" fill="#475569">directory sources</text>
      <rect x="690" y="416" width="250" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="815" y="442" font-size="15" font-weight="600" fill="#334155">System.Text.Json</text>
      <text x="815" y="462" font-size="12" fill="#475569">JSON documents</text>
    </g>
  </g>
</svg>
