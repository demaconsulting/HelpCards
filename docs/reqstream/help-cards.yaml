---
# Software System Requirements for HelpCards
#
# These requirements describe the externally visible behavior of the library
# from the perspective of its consumers, without specifying implementation details.
# Every requirement here is tagged 'system' so it is a root of the decomposition
# (see root-tags in requirements.yaml).

sections:
  - title: HelpCards Requirements
    requirements:
      - id: HelpCards-Embedding-DefaultDirectory
        title: >-
          A project that references the package shall embed every file of its Help folder as an assembly
          resource whose name starts with the assembly name followed by ".Help/" without any further
          configuration.
        tags: [system]
        justification: |
          Library authors expect to drop Markdown cards into a Help folder and have them travel with
          the assembly; any required boilerplate would be repeated in every adopting project.
        tests:
          - HelpCards_Embedding_DefaultDirectory_UsesAssemblyNamePrefix

      - id: HelpCards-Embedding-OverriddenDirectory
        title: >-
          A project shall be able to override the embedded folder and the resource name prefix, and every
          file below the folder, including nested folders and data files, shall be embedded under the
          prefix with "/" separators.
        tags: [system]
        justification: |
          Projects that already use another folder name, or that embed several sources side by side,
          need to choose the folder and the prefix without changing the package.
        tests:
          - HelpCards_Embedding_OverriddenDirectory_EmbedsEveryFileUnderPrefix
          - HelpCards_Embedding_EmbeddedResource_ReadsAuthoredContent

      - id: HelpCards-Embedding-LoadSources
        title: >-
          A help source shall be creatable from the embedded resources of an assembly, from the files of a
          directory, or from text held in memory, and creating a source shall perform no I/O.
        tags: [system]
        justification: |
          Libraries embed cards, authors edit them in a directory while writing, and tools generate help at
          run time; creating a source must be cheap because a library keeps it in a static field.
        children:
          - HelpCards-Loading-Sources
        tests:
          - HelpCards_Sources_Assembly_ReadsEmbeddedCards
          - HelpCards_Sources_Directory_ReadsFilesOnDisk
          - HelpCards_Sources_Memory_ReadsFiles
          - HelpCards_Sources_Construction_PerformsNoIo

      - id: HelpCards-FrontMatter-RestrictedSubset
        title: >-
          Cards shall be written in a restricted subset of YAML front matter that is decoded without any
          YAML dependency, and every construct outside the subset shall be rejected with an error that
          names the file and the line.
        tags: [system]
        justification: |
          A dependency-free decoder keeps every adopting library and tool dependency-free, and strict,
          line-accurate errors let authors fix a card without guessing what a YAML parser would have done.
        children:
          - HelpCards-Loading-FrontMatter
        tests:
          - HelpCards_FrontMatter_ValidSubset_ReadsCard
          - HelpCards_FrontMatter_UnsupportedConstruct_ReportsFileAndLine

      - id: HelpCards-FrontMatter-Keys
        title: >-
          Cards, overlays, translations, and the source description shall accept only the keys defined for
          them, with every value following the grammar of its key, and an unknown key shall be reported with
          the keys that are allowed.
        tags: [system]
        justification: |
          A strict key matrix catches typos such as "tag" for "tags" that would otherwise silently drop
          information from the help.
        children:
          - HelpCards-Loading-Cards
        tests:
          - HelpCards_FrontMatter_UnknownKey_ReportsKeyAndAllowedKeys

      - id: HelpCards-Tokens-Substitution
        title: >-
          Text of cards shall be able to use tokens that are replaced with the values of the source and the
          built-in tool name and version, and an unknown token shall be an error that names the file and the
          line.
        tags: [system]
        justification: |
          Tokens keep values such as limits and tool names in one place so that help stays correct when
          they change.
        children:
          - HelpCards-Loading-Tokens
        tests:
          - HelpCards_Tokens_BuiltInAndSourceTokens_AreReplaced
          - HelpCards_Tokens_UnknownToken_ReportsFileAndLine

      - id: HelpCards-Cultures-Fallback
        title: >-
          Cards shall be translatable per file, an explicitly requested culture shall select the most
          specific translation with fallback to less specific cultures and to the neutral text, and the
          neutral culture shall select neutral text only.
        tags: [system]
        justification: |
          Help is read in the language of the reader; a partly translated source must still be complete.
        children:
          - HelpCards-Loading-Cultures
          - HelpCards-Catalog-Cultures
        tests:
          - HelpCards_Cultures_Translation_IsSelectedPerFileWithFallback
          - HelpCards_Cultures_Catalog_ExposesTranslatedCardsWithBodyCulture

      - id: HelpCards-Links-Syntax
        title: >-
          Card bodies shall be able to link to cards, to examples, and to cards of other sources outside code
          spans and fences, and text that starts like a link but is not one shall be an error.
        tags: [system]
        justification: |
          Cards refer to each other; links that fail silently would leave readers with broken references,
          while code samples must be able to show the same brackets.
        children:
          - HelpCards-Loading-Links
        tests:
          - HelpCards_Links_OutsideCode_AreRecognizedAndTyposReported

      - id: HelpCards-Diagnostics-Problems
        title: >-
          Every defect of a source shall be reported as a problem that carries its severity, rule, source,
          file, line, and message, and all defects of a source shall be collected instead of stopping at the
          first.
        tags: [system]
        justification: |
          Authors fix their help in one pass; a precise, structured problem list is also what tests and
          tools need to assert that cards are valid.
        children:
          - HelpCards-Loading-Diagnostics
          - HelpCards-Catalog-Problems
        tests:
          - HelpCards_Diagnostics_Defects_AreReportedWithAllFields
          - HelpCards_Diagnostics_SeveralDefectiveFiles_AreAllCollected

      - id: HelpCards-Diagnostics-FailureModel
        title: >-
          Creating a catalog from a defective source shall throw one exception that carries every error, and an
          invalid argument shall throw an argument exception that is never that exception.
        tags: [system]
        justification: |
          Callers must be able to tell defective help content, which authors fix, from a programming mistake,
          which developers fix.
        children:
          - HelpCards-Composition-Failures
          - HelpCards-Catalog-Failures
        tests:
          - HelpCards_Diagnostics_CreateFailure_ThrowsCatalogExceptionForDefectsAndArgumentExceptionForMisuse

      - id: HelpCards-Tree-Structure
        title: >-
          A catalog shall expose the cards of a source as an immutable tree with roots, children, aliases, tags,
          see-also entries, examples, and links, and shall read no file after it was created.
        tags: [system]
        justification: |
          The tree is the product of the library; adopters, renderers, and agents all start from it, and it is
          shared between threads, so it must not change or touch the file system.
        children:
          - HelpCards-Composition-Tree
          - HelpCards-Composition-SingleSource
          - HelpCards-Catalog-Model
        tests:
          - HelpCards_Catalog_SimpleFixture_ExposesTreeAliasesTagsExamplesAndLinks
          - HelpCards_Catalog_Create_IsImmutableAndReadsNoFilesAfterwards

      - id: HelpCards-Ordering-Siblings
        title: >-
          Cards that share a parent, and the roots, shall be ordered by the children list of their parent, then by
          order value, then by name.
        tags: [system]
        justification: |
          Help is read top down; authors must be able to steer the order and rely on it being stable.
        children:
          - HelpCards-Composition-Ordering
        tests:
          - HelpCards_Ordering_OrderFixture_FollowsChildrenOrderThenName

      - id: HelpCards-References-Resolution
        title: >-
          Links, see-also entries, and example links shall be resolved over the whole tree, so that forward
          references are valid, and every broken reference and every repeated name shall be reported with file and
          line.
        tags: [system]
        justification: |
          Cards refer to each other; dead references and ambiguous names would leave readers with wrong help.
        children:
          - HelpCards-Composition-References
          - HelpCards-Composition-Uniqueness
        tests:
          - HelpCards_References_BrokenAndForwardReferences_AreHandled

      - id: HelpCards-Lookup-PathsAndExamples
        title: >-
          A catalog shall find cards by a path of names and aliases and examples by name, and a failed path shall
          report the valid names at the level where it failed.
        tags: [system]
        justification: |
          Command lines and agents address help by path; a failed path must tell the caller what would have worked.
        children:
          - HelpCards-Catalog-Lookup
        tests:
          - HelpCards_Lookup_PathsAndExamples_FindCardsAndExamples

      - id: HelpCards-Views-Subsets
        title: >-
          A catalog shall provide views that show a subset of its cards by tag, source, predicate, or id without
          changing the catalog, and a view shall never point at a card it hides.
        tags: [system]
        justification: |
          Products show different parts of their help to different readers.
        children:
          - HelpCards-Catalog-Views
        tests:
          - HelpCards_Views_FilterSourceWhereWithout_ShowSubsetsAndHideTargets

      - id: HelpCards-Vocabulary-TagsAndRoots
        title: >-
          A catalog shall be able to enforce a closed tag vocabulary, required tags, and an expected set of root
          cards.
        tags: [system]
        justification: |
          A product that fixes its topics and tags needs a build failure when a card strays from them.
        children:
          - HelpCards-Composition-Vocabulary
        tests:
          - HelpCards_Tags_VocabularyAndExpectedRoots_AreEnforced

      - id: HelpCards-ThreadSafety-SharedCatalog
        title: >-
          One catalog and the views made from it shall be safe to use from many threads at the same time, for
          lookups, views, and rendering.
        tags: [system]
        justification: |
          A tool or service creates its catalog once and shares it between all requests.
        children:
          - HelpCards-Catalog-Concurrency
        tests:
          - HelpCards_ThreadSafety_ParallelUse_IsConsistent
          - HelpCards_ThreadSafety_ParallelRendering_IsConsistent

      - id: HelpCards-Determinism-Output
        title: >-
          Creating a catalog from the same source, and rendering it, shall give the same result whatever the current
          culture of the machine is.
        tags: [system]
        justification: |
          Help text and its order must be byte-identical on every machine.
        children:
          - HelpCards-Presentation-Determinism
        tests:
          - HelpCards_Determinism_CreateTwice_IsEqualRegardlessOfCurrentCulture
          - HelpCards_Determinism_RenderTwice_IsEqualRegardlessOfCurrentCulture

      - id: HelpCards-Rendering-TextAndMarkdown
        title: >-
          A catalog shall render a card, the index, and a list of cards as plain text and as Markdown with a fixed
          layout, wrapping only the lines it generates, with LF line endings and no trailing line feed.
        tags: [system]
        justification: |
          People read help in a terminal and in documents; a fixed, byte-stable layout can be learned and tested.
        children:
          - HelpCards-Presentation-Text
          - HelpCards-Presentation-Markdown
          - HelpCards-Presentation-Lists
          - HelpCards-Presentation-Wrapping
          - HelpCards-Presentation-Options
          - HelpCards-Catalog-Rendering
        tests:
          - HelpCards_Rendering_SimpleFixtureText_EqualsGolden
          - HelpCards_Rendering_SimpleFixtureMarkdown_EqualsGolden

      - id: HelpCards-Rendering-LinkStyles
        title: >-
          A catalog shall write the links of card bodies and lists in a plain, a command, and a Markdown style or
          through a callback of the caller, and never point at a card that a view hides.
        tags: [system]
        justification: |
          The same card is read in a terminal, in a document, and inside a tool with its own links.
        children:
          - HelpCards-Presentation-LinkStyles
        tests:
          - HelpCards_Rendering_LinkStyles_WriteTargetsInEachStyle

      - id: HelpCards-Rendering-Examples
        title: >-
          A catalog shall print the examples of a card in full, list the cards below that have examples, and print
          one example alone as exactly its content.
        tags: [system]
        justification: |
          Examples are saved to files and run, so they must come out unchanged.
        children:
          - HelpCards-Presentation-Examples
        tests:
          - HelpCards_Rendering_Examples_ArePrintedInFullOrAlone

      - id: HelpCards-JsonContract-Documents
        title: >-
          A catalog shall render its cards, indexes, examples, search results, and card lists as JSON documents of
          contract version 1, each on one line of ASCII without any null, with the keys in a fixed order.
        tags: [system]
        justification: |
          Tools and agents parse the JSON, so it follows a frozen, versioned contract.
        children:
          - HelpCards-Presentation-Json
          - HelpCards-Presentation-JsonContract
        tests:
          - HelpCards_Rendering_SimpleFixtureJson_EqualsGolden
          - HelpCards_JsonContract_Documents_AreOneAsciiLineWithoutNull

      - id: HelpCards-NoDependencies-FrameworkOnly
        title: >-
          The library shall reference no assembly that is not part of the .NET base class library.
        tags: [system]
        justification: |
          Every adopting library and tool stays free of transitive dependencies.
        tests:
          - HelpCards_NoDependencies_ReferencedAssemblies_AreFrameworkOnly
