---
# HelpCli Unit Requirements
#
# Requirements for the HelpCli unit of the Integration subsystem: the helper a tool creates once, the gate that lets
# only the help verb through, the footer, and the options it is created from.

sections:
  - title: HelpCards Requirements
    sections:
      - title: Integration Requirements
        sections:
          - title: HelpCli Requirements
            requirements:
              - id: HelpCards-Integration-HelpCli-Creation
                title: >-
                  The helper shall be created without building the catalog or doing any I/O, shall give a footer
                  that is a constant sentence naming the tool and the verb, and shall reject a null option set, options
                  with neither or both of the catalog configuration and the catalog factory, an output or error writer
                  given together with its provider, a tool name or verb that is white space, a verb with white space or
                  a leading hyphen, a tool name with a brace, a white-space command template, and a default width that
                  is not 0 or 20 to 500.
                justification: |
                  A helper is kept in a static field and its footer is printed by commands that never need the catalog.
                tests:
                  - HelpCli_Create_AndFooter_NeverCallTheFactory
                  - HelpCli_Create_InvalidOptions_Throw
                  - HelpCli_Create_BothFactoryAndConfigure_Throws
                  - HelpCli_Create_NeitherFactoryNorConfigure_Throws
                  - HelpCli_Create_OutputAndProvider_Throws

              - id: HelpCards-Integration-HelpCli-Gate
                title: >-
                  The helper shall return false at once, with exit code 0, without creating the catalog and without
                  writing, unless the first argument equals the verb ignoring case, and shall run the help command
                  of the remaining arguments when it does.
                justification: |
                  Every command of the tool passes through the gate, so it must be free for all but help.
                tests:
                  - HelpCli_TryRun_NotTheVerb_ReturnsFalseWithoutCallingTheFactory
                  - HelpCli_TryRun_Verb_RunsTheCommandIgnoringCase
                  - HelpCli_TryRun_VerbAlone_WritesTheIndex

              - id: HelpCards-Integration-HelpCli-Verb
                title: >-
                  The helper shall use the verb of the options in place of help, in the gate and in the footer.
                justification: |
                  Some tools already use help for something else.
                tests:
                  - HelpCli_Create_CustomVerb_ReplacesHelp

              - id: HelpCards-Integration-HelpCli-Run
                title: >-
                  The helper shall run a help command given the arguments after the verb, and reject null arguments
                  and a null argument in the list.
                justification: |
                  Tools that already removed the verb call the command directly.
                tests:
                  - HelpCli_Run_Arguments_AreTheWordsAfterTheVerb

              - id: HelpCards-Integration-HelpCli-Configuration
                title: >-
                  The helper shall build the catalog only after the verb is seen, from the configuration of the
                  options: the tool name, the version when set, and the culture of the language option are set on the
                  catalog builder first and then the configuration action of the tool runs and may override them, and
                  the options shall give the same configuration to the tests of the tool, which needs a configuration
                  action to give.
                justification: |
                  The tool name and the version are set once, and the tests of the tool validate exactly the
                  composition that users get.
                tests:
                  - HelpCli_TryRun_ConfigureCatalog_BuildsOnlyAfterVerb
                  - HelpCli_TryRun_ConfigureCatalog_AppliesToolNameVersionAndCulture
                  - HelpCliOptions_GetCatalogConfiguration_AppliesTheSettingsOfTheHelper
                  - HelpCliOptions_GetCatalogConfiguration_WithoutConfigure_Throws

              - id: HelpCards-Integration-HelpCli-Writers
                title: >-
                  The helper shall call the output and error providers of the options when it writes, not when it is
                  created, use the console for a provider that returns null, and not take the width of the console for
                  automatic width when a provider writes the output.
                justification: |
                  A tool decides at command time where help goes, for example to nowhere under a silent option that is
                  parsed after the helper was created.
                tests:
                  - HelpCli_TryRun_OutputProvider_IsCalledAtCommandTime
                  - HelpCli_TryRun_ProviderReturnsNull_UsesConsole
                  - HelpCli_TryRun_ProviderAndAutoWidth_IsNotTheConsoleWidth

              - id: HelpCards-Integration-HelpCli-Contract
                title: >-
                  The options shall offer the envelope callback, the error body callback, and the exit codes of success,
                  usage errors, and internal errors for a tool with a contract of its own, default to no callbacks and
                  to the exit codes 0, 2, and 70, accept exit codes from 0 to 255 only, and reject a null set of exit
                  codes.
                justification: |
                  The defaults keep the contract of the helper, and an exit code outside the range of the operating
                  system cannot be reported faithfully.
                tests:
                  - HelpCliOptions_Defaults_AreTheContractOfTheHelper
                  - HelpCliExitCodes_Init_OutOfRangeOrNull_Throws
