---
# Quality/process requirements grouping HelpCards's use of off-the-shelf
# (OTS) process tooling. These requirements exist so that OTS-derived requirements
# (which describe capabilities the repository's build/quality pipeline relies on
# from third-party tools, not user-visible library functionality) are not reported
# as orphans by `dotnet reqstream --requirements requirements.yaml --enforce`.
# The titles and justifications state the outcome the pipeline needs and do not name
# the tools; the OTS requirements linked as children name each tool.
sections:
  - title: Quality Requirements
    requirements:
      - id: Quality-TestInfrastructure
        title: The repository shall execute automated tests and report their results.
        tags: [quality]
        justification: |
          Automated testing depends on test execution and result reporting
          capabilities. This grouping requirement links the test-framework OTS
          requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from library functionality.
        children:
          - HelpCards-OTS-xUnit-Execute
          - HelpCards-OTS-xUnit-Report

      - id: Quality-BuildIntegrity
        title: >-
          The repository's build pipeline shall document build metadata and
          track the versions of the tools it uses.
        tags: [quality]
        justification: |
          CI/CD reliability depends on build-notes generation and version-tracking
          capabilities. This grouping requirement links those OTS requirements to
          the quality root so they participate in orphan detection without being
          falsely reported as disconnected from library functionality.
        children:
          - HelpCards-OTS-BuildMark
          - HelpCards-OTS-VersionMark
          - HelpCards-OTS-VersionMark-Lint

      - id: Quality-StaticAnalysis
        title: The repository shall report static-analysis and code-quality results.
        tags: [quality]
        justification: |
          Code quality assurance depends on reporting static-analysis (SARIF) results
          and hosted code-quality results. This grouping requirement links those
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from library
          functionality.
        children:
          - HelpCards-OTS-SarifMark
          - HelpCards-OTS-SarifMark-Enforcement
          - HelpCards-OTS-SonarMark

      - id: Quality-PeerReview
        title: The repository shall track peer review of its files and report review coverage.
        tags: [quality]
        justification: |
          Peer-review compliance depends on indexing, enforcement, elaboration,
          linting, and directory-override capabilities of the review-tracking tool.
          This grouping requirement links those OTS requirements to the quality root
          so they participate in orphan detection without being falsely reported as
          disconnected from library functionality.
        children:
          - HelpCards-OTS-ReviewMark
          - HelpCards-OTS-ReviewMark-IndexScan
          - HelpCards-OTS-ReviewMark-Enforce
          - HelpCards-OTS-ReviewMark-Elaborate
          - HelpCards-OTS-ReviewMark-Lint
          - HelpCards-OTS-ReviewMark-DirectoryOverride

      - id: Quality-DocumentationGeneration
        title: >-
          The repository shall generate its documentation as HTML and PDF and
          ship an API reference with its package.
        tags: [quality]
        justification: |
          Documentation generation depends on format conversion from Markdown to
          HTML and from HTML to PDF, and on generating the Markdown API reference
          packed into the NuGet package. This grouping requirement links those OTS
          requirements to the quality root so they participate in orphan detection
          without being falsely reported as disconnected from library functionality.
        children:
          - HelpCards-OTS-Pandoc
          - HelpCards-OTS-WeasyPrint
          - HelpCards-OTS-ApiMark

      - id: Quality-RequirementsTraceability
        title: >-
          The repository shall validate requirements traceability and the content
          of its generated documents.
        tags: [quality]
        justification: |
          Requirements traceability depends on requirements linting and reporting
          capabilities, and generated-document verification depends on document
          assertions. This grouping requirement links those OTS requirements to the
          quality root so they participate in orphan detection without being falsely
          reported as disconnected from library functionality.
        children:
          - HelpCards-OTS-ReqStream
          - HelpCards-OTS-ReqStream-Lint
          - HelpCards-OTS-FileAssert

      - id: Quality-SoftwareStructureModeling
        title: The repository shall lint its software-structure model and render its views.
        tags: [quality]
        justification: |
          Software-structure documentation depends on model-linting and
          diagram-rendering capabilities. This grouping requirement links those
          OTS requirements to the quality root so they participate in orphan
          detection without being falsely reported as disconnected from library
          functionality.
        children:
          - HelpCards-OTS-SysML2Tools-Lint
          - HelpCards-OTS-SysML2Tools-Render
