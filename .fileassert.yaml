---
# FileAssert document validation tests for HelpCards.
# Tests are tagged by document group to allow per-group execution during the build pipeline.
# Tags: build-notes, code-quality, code-review, design, verification, user-guide, requirements.
#
# NOTE: build-notes through user-guide tests provide OTS evidence for Pandoc and WeasyPrint
# and run before ReqStream. The requirements tests run after ReqStream and validate the
# final outputs, but do not contribute to OTS requirements evidence.

tests:

  # --- PACKAGE ---
  # The packaged build files are what embeds help cards in consuming projects, so the package
  # must carry them under build\ (not buildTransitive\).

  - name: HelpCards_PackageBuildFiles
    description: "The DemaConsulting.HelpCards package contains the packaged props and targets under build"
    tags: [package]
    files:
      - pattern: "src/DemaConsulting.HelpCards/bin/Release/DemaConsulting.HelpCards.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "build/DemaConsulting.HelpCards.props"
              min: 1
              max: 1
              text:
                - contains: "HelpCardsEnabled"
            - pattern: "build/DemaConsulting.HelpCards.targets"
              min: 1
              max: 1
              text:
                - contains: "LogicalName"

  # --- API DOCUMENTATION ---
  # ApiMark generates the API reference during the build and `dotnet pack` ships it in the
  # package under api/. This test provides OTS evidence for ApiMark
  # (docs/reqstream/ots/apimark.yaml) and runs with the package assertions in the build job.

  - name: ApiMark_NuGetPackageContainsDocs
    description: "The DemaConsulting.HelpCards package contains the API reference generated by ApiMark"
    tags: [package]
    files:
      - pattern: "src/DemaConsulting.HelpCards/bin/Release/DemaConsulting.HelpCards.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "api/api.md"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.HelpCards.Catalog"
            - pattern: "api/DemaConsulting.HelpCards.Catalog.md"
              min: 1
              max: 1
            - pattern: "api/**/*.md"
              min: 100

  # --- BUILD NOTES ---

  - name: Pandoc_BuildNotesHtml
    description: "Build Notes HTML was generated by Pandoc"
    tags: [build-notes]
    files:
      - pattern: "docs/build_notes/generated/build_notes.html"
        count: 1
        html:
          - query: "//head/title"
            count: 1
        text:
          - contains: "Build Notes"

  - name: WeasyPrint_BuildNotesPdf
    description: "Build Notes PDF was generated by WeasyPrint"
    tags: [build-notes]
    files:
      - pattern: "docs/generated/HelpCards Build Notes.pdf"
        count: 1
        pdf:
          metadata:
            - field: "Title"
              contains: "HelpCards"
            - field: "Author"
              contains: "DEMA Consulting"
            - field: "Subject"
              contains: "Build notes"
          pages:
            min: 1
          text:
            - contains: "Build Notes"

